name: render-kindle-dashboard
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: pip install pillow icalendar recurring-ical-events requests
      - run: python render.py
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          TASKS_URL: ${{ secrets.TASKS_URL }}
          TODO_URL: ${{ secrets.TODO_URL }}
          USAGE_URL: ${{ secrets.USAGE_URL }}
          GT_CLIENT_ID: ${{ secrets.GT_CLIENT_ID }}
          GT_CLIENT_SECRET: ${{ secrets.GT_CLIENT_SECRET }}
          GT_REFRESH_TOKEN: ${{ secrets.GT_REFRESH_TOKEN }}
          IMG_NAME: ${{ secrets.IMG_NAME }}
          KW: ${{ vars.KW }}
          KH: ${{ vars.KH }}
          TZ_NAME: Asia/Ho_Chi_Minh
          HN_QUERIES: "Anthropic,Claude Code"
          REDDIT_SUBS: "ClaudeAI"
          GH_REPOS: "anthropics/claude-code"
          YT_CHANNELS: ""
          NEWS_N: "5"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
